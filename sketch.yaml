# Morse Game for M5Stack - arduino-cli sketch profiles
#
#   arduino-cli compile --profile core2
#   arduino-cli upload  --profile core2 -p <port>
#
# The ESP32 core is pinned to 2.0.17: with 3.x, M5Unified's spk_task
# overflows its stack and crashes on the first sound.

profiles:
  core2:
    notes: M5Stack Core2 (key on GPIO 33, Grove Port A)
    fqbn: esp32:esp32:m5stack-core2
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - M5Unified (0.2.28)
      - M5GFX (0.2.35)

  cores3:
    notes: M5Stack CoreS3 (key on GPIO 8, Grove Port B)
    fqbn: esp32:esp32:m5stack-cores3
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - M5Unified (0.2.28)
      - M5GFX (0.2.35)

default_profile: cores3
